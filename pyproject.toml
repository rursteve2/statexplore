[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statexplore"
version = "0.1.0"
description = "Automated statistical model discovery and teaching studio (offline Windows desktop app)."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyreadstat>=1.2",
    "openpyxl>=3.1",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-timeout>=2.3"]

[project.scripts]
statexplore = "statexplore.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
statexplore = ["r/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = ["r: requires a working R installation with Phase 1 packages"]
